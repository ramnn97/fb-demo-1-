<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" fill="none">
  <defs>
    <linearGradient id="sky" x1="360" y1="0" x2="360" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122043"/>
      <stop offset=".52" stop-color="#3e7194"/>
      <stop offset="1" stop-color="#f2a993"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 380 -340 0 360 395)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe3b3" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffd3b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="360" y1="545" x2="360" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#316b7c"/>
      <stop offset="1" stop-color="#101b36"/>
    </linearGradient>
    <linearGradient id="sun" x1="270" y1="250" x2="448" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0cf"/>
      <stop offset="1" stop-color="#f58e92"/>
    </linearGradient>
  </defs>
  <style>
    .sun { animation: sun-drift 7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .haze { animation: haze-pulse 6s ease-in-out infinite alternate; }
    .wave-a { animation: wave 9s ease-in-out infinite alternate; }
    .wave-b { animation: wave 12s ease-in-out infinite alternate-reverse; }
    .spark { animation: shimmer 2.2s ease-in-out infinite alternate; }
    @keyframes sun-drift { to { transform: translateY(-24px) scale(1.04); } }
    @keyframes haze-pulse { to { opacity: .45; transform: scale(1.12); } }
    @keyframes wave { to { transform: translateX(36px) scaleY(.82); } }
    @keyframes shimmer { to { opacity: .2; } }
  </style>
  <rect width="720" height="900" fill="url(#sky)"/>
  <rect class="haze" width="720" height="700" fill="url(#glow)"/>
  <circle class="sun" cx="360" cy="342" r="112" fill="url(#sun)"/>
  <path d="M0 575C108 542 219 539 360 557c146 19 255 17 360-13v356H0V575Z" fill="url(#sea)"/>
  <path class="wave-a" d="M-40 608c110-24 180-24 280 0s179 24 278 0 175-22 242-7" stroke="#c5eff0" stroke-opacity=".52" stroke-width="2"/>
  <path class="wave-b" d="M-60 674c117-22 195-20 294 4 99 23 177 21 278-5 100-26 178-26 275-2" stroke="#98dce2" stroke-opacity=".37" stroke-width="2"/>
  <path class="wave-a" d="M-50 748c112-18 202-17 300 3 99 20 182 19 278-4s172-23 249-8" stroke="#c5eff0" stroke-opacity=".28" stroke-width="2"/>
  <path class="wave-b" d="M-60 822c122-20 208-17 307 4 100 22 184 20 282-5 99-24 174-21 252-5" stroke="#98dce2" stroke-opacity=".24" stroke-width="2"/>
  <g fill="#fff0ce">
    <circle class="spark" cx="164" cy="622" r="2"/><circle class="spark" cx="540" cy="655" r="2"/>
    <circle class="spark" cx="286" cy="710" r="1.5"/><circle class="spark" cx="458" cy="778" r="1.5"/>
    <circle class="spark" cx="192" cy="807" r="1.5"/><circle class="spark" cx="567" cy="740" r="1.5"/>
  </g>
</svg>
